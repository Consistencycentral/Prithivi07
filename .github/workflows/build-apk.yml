name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java + Android SDK (set up BEFORE cap sync) ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Node.js + Web Build ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking out/ directory..."
          ls -la out/
          echo "Pages found:"
          ls -d out/*/

      # ── Capacitor Sync ──
      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Verify Android assets
        run: |
          echo "Checking Android assets..."
          ls -la android/app/src/main/assets/public/
          echo "Capacitor plugins dir:"
          ls -la android/capacitor-cordova-android-plugins/ || echo "cordova plugins dir created"

      # ── Build APK ──
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Upload ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitArc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
