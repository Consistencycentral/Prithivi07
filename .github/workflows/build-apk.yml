name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static site
        run: npm run build

      - name: Copy build to Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r out/* android/app/src/main/assets/www/

      # Generate fallback PNG icons using pure Python (no ImageMagick needed)
      - name: Generate launcher icon PNGs
        run: |
          python3 << 'PYEOF'
          import struct, zlib

          def create_png(width, height, bg_rgb, letter, filename):
              """Create a simple PNG with a colored background and centered letter."""
              # Create raw pixel data (RGBA)
              rows = []
              cx, cy = width // 2, height // 2
              radius = min(width, height) // 2

              for y in range(height):
                  row = b'\x00'  # filter byte
                  for x in range(width):
                      # Simple filled square with the background color
                      row += bytes(bg_rgb) + b'\xff'
                  rows.append(row)

              raw_data = b''.join(rows)

              def make_chunk(chunk_type, data):
                  chunk = chunk_type + data
                  crc = zlib.crc32(chunk) & 0xffffffff
                  return struct.pack('>I', len(data)) + chunk + struct.pack('>I', crc)

              # PNG signature
              sig = b'\x89PNG\r\n\x1a\n'

              # IHDR
              ihdr_data = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              ihdr = make_chunk(b'IHDR', ihdr_data)

              # IDAT
              compressed = zlib.compress(raw_data)
              idat = make_chunk(b'IDAT', compressed)

              # IEND
              iend = make_chunk(b'IEND', b'')

              with open(filename, 'wb') as f:
                  f.write(sig + ihdr + idat + iend)

          # Indigo color (99, 102, 241) matching #6366f1
          bg = (99, 102, 241)

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          import os
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              create_png(size, size, bg, 'H', f'{path}/ic_launcher.png')
              create_png(size, size, bg, 'H', f'{path}/ic_launcher_round.png')
              print(f'  Created {size}x{size} icons in {folder}')

          print('All icons generated successfully!')
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitArc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
