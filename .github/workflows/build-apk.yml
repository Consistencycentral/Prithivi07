name: Build APK

on:
  # Trigger manually from GitHub website
  workflow_dispatch:
  # Also trigger on push to main (optional — remove if you only want manual)
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies & build Next.js static export
      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static site
        run: npm run build

      # 4. Copy web build output into Android assets
      - name: Copy build to Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r out/* android/app/src/main/assets/www/

      # 5. Set up Java (required for Gradle/Android build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Make Gradle wrapper executable & build APK
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 8. Upload APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitArc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
