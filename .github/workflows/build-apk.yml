name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static site
        run: npm run build

      # Copy directly to assets/ (NOT assets/www/)
      # WebViewAssetLoader serves assets/ at the root path /
      # So /_next/static/... maps to assets/_next/static/...
      - name: Copy build to Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r out/* android/app/src/main/assets/

      - name: Generate launcher icon PNGs
        run: |
          python3 << 'PYEOF'
          import struct, zlib, os

          def create_png(width, height, rgb, filename):
              rows = []
              for y in range(height):
                  row = b'\x00'
                  for x in range(width):
                      row += bytes(rgb) + b'\xff'
                  rows.append(row)
              raw_data = b''.join(rows)

              def chunk(ctype, data):
                  c = ctype + data
                  crc = zlib.crc32(c) & 0xffffffff
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', crc)

              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw_data))
              iend = chunk(b'IEND', b'')

              with open(filename, 'wb') as f:
                  f.write(sig + ihdr + idat + iend)

          bg = (99, 102, 241)
          for folder, size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              create_png(size, size, bg, f'{path}/ic_launcher.png')
              create_png(size, size, bg, f'{path}/ic_launcher_round.png')
              print(f'  Created {size}x{size} icons in {folder}')
          print('Done!')
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitArc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
